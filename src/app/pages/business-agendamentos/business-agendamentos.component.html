<!-- Template: business-agendamentos.component.html -->
<div class="agenda-container">

  <!-- Apenas filtro de Data -->
  <mat-form-field appearance="fill">
    <mat-label>Data</mat-label>
    <input matInput [matDatepicker]="picker" [(ngModel)]="selectedDate" (dateChange)="onDateChange($event)">
    <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
    <mat-datepicker #picker></mat-datepicker>
  </mat-form-field>

  <button mat-raised-button color="primary" (click)="pesquisarPorData()">Pesquisar</button>

  <!-- Grade por Profissional -->
  <div *ngIf="agendamentosAgrupados?.length" class="grade-container">
    <div class="grade-header">
      <div class="horario-coluna"></div>
      <div class="prof-coluna" *ngFor="let grupo of agendamentosAgrupados">
        {{ grupo.profissional.nome }}<br>
        <small>{{ grupo.profissional.especialidade }}</small>
      </div>
    </div>

    <div class="grade-linhas">
      <div *ngFor="let hora of horariosPadrao" class="linha-horario">
        <div class="horario-coluna">{{ hora }}</div>
        <div class="prof-coluna" *ngFor="let grupo of agendamentosAgrupados">
          <ng-container *ngIf="getAgendamento(hora, grupo.profissional.id) as agendamento; else vazio">
            <div class="agendamento-box ocupado"
                 [ngClass]="agendamento.status.toLowerCase()"
                 [matTooltip]="
                  'Cliente: ' + agendamento.cliente + '\n' +
                  'Serviço: ' + agendamento.servico + '\n' +
                  'Status: ' + agendamento.status
                 "
                 matTooltipClass="agendamento-tooltip"
                 matTooltipPosition="right"
                 (click)="onAgendamentoClick(hora, grupo.profissional.id)">
              <strong>Ocupado</strong><br>
              <span>{{ agendamento.cliente }}</span><br>
              <small>{{ agendamento.servico }}</small>
            </div>
          </ng-container>
          <ng-template #vazio>
            <div class="agendamento-box vazio"
                 matTooltip="Clique para agendar"
                 (click)="onAgendamentoClick(hora, grupo.profissional.id)">
              <small>Disponível</small>
            </div>
          </ng-template>
<style>
.agendamento-box.ocupado {
  background-color: #757575;
  color: #fff;
  font-weight: bold;
}
</style>
        </div>
      </div>
    </div>
  </div>

  <div *ngIf="!agendamentosAgrupados?.length">
    <p>Nenhum agendamento encontrado para a data selecionada.</p>
  </div>
</div>
