<div class="agenda-container">
  <!-- Linha: Data + Pesquisar -->
  <div class="header-row">
    <div class="date-card">
      <div>
        <div class="date-card-title">Data</div>
        <mat-form-field appearance="fill" class="date-field">
          <input
            matInput
            [matDatepicker]="picker"
            [(ngModel)]="selectedDate"
            (dateChange)="onDateChange($event)"
          />
          <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
          <mat-datepicker #picker></mat-datepicker>
        </mat-form-field>
      </div>
    </div>

    <button
      mat-raised-button
      color="primary"
      class="search-button"
      (click)="pesquisarPorData()"
    >
      <mat-icon>search</mat-icon>
      <span>Pesquisar</span>
    </button>
  </div>

  <!-- Linha: filtro + opções -->
  <div class="toolbar-row">
    <mat-form-field appearance="outline" class="filter-field">
      <mat-label>Filtrar profissionais</mat-label>
      <input
        matInput
        placeholder="Digite o nome do profissional"
        [(ngModel)]="filtroProfissional"
      />
      <button
        *ngIf="filtroProfissional"
        matSuffix
        mat-icon-button
        aria-label="Limpar filtro"
        (click)="filtroProfissional = ''"
      >
        <mat-icon>close</mat-icon>
      </button>
    </mat-form-field>

    <mat-checkbox [(ngModel)]="compactMode">
      Modo compacto
    </mat-checkbox>

    <mat-checkbox [(ngModel)]="showOnlyOccupied">
      Mostrar só ocupados
    </mat-checkbox>
  </div>

  <!-- Grade de agendamentos: sempre visível, mesmo sem agendamentos -->
  <div class="grade-container">
    <div class="agenda-scroll">
      <table class="agenda-grid" [class.compact-mode]="compactMode">
        <thead>
          <tr>
            <th class="time-header">Horário</th>
            <th class="prof-header" *ngFor="let grupo of gruposFiltrados()">
              <div class="prof-name">
                {{ grupo.profissional.nome }}
              </div>
              <div
                class="prof-subtitle"
                *ngIf="grupo.profissional.especialidade"
              >
                {{ grupo.profissional.especialidade }}
              </div>
            </th>
          </tr>
        </thead>

        <tbody>
          <tr *ngFor="let hora of horariosPadrao">
            <!-- Coluna dos horários -->
            <td class="time-cell">
              <button class="time-pill">
                {{ hora }}
              </button>
            </td>

            <!-- Colunas dos profissionais -->
            <td class="slot-cell" *ngFor="let grupo of gruposFiltrados()">
              <ng-container
                *ngIf="isSlotVisible(hora, grupo.profissional.id)"
              >
                <!-- Slot ocupado -->
                <ng-container
                  *ngIf="
                    getAgendamento(hora, grupo.profissional.id)
                      as agendamento;
                    else disponivel
                  "
                >
                  <div
                    class="agendamento-card"
                    [ngClass]="
                      'status-' +
                      (agendamento.status || 'pendente').toLowerCase()
                    "
                    [matTooltip]="
                      'Cliente: ' +
                      agendamento.cliente +
                      '\n' +
                      'Serviço: ' +
                      agendamento.servico +
                      '\n' +
                      'Status: ' +
                      agendamento.status
                    "
                    matTooltipClass="agendamento-tooltip"
                    matTooltipPosition="above"
                    (click)="onAgendamentoClick(hora, grupo.profissional.id)"
                  >
                    <div class="agendamento-status-chip">
                      {{ agendamento.status || 'Ocupado' }}
                    </div>
                    <div class="agendamento-cliente">
                      {{ agendamento.cliente }}
                    </div>
                    <div
                      class="agendamento-servico"
                      *ngIf="!compactMode"
                    >
                      {{ agendamento.servico }}
                    </div>
                  </div>
                  <!-- Botão fora do card, ao lado direito do slot -->
                  <div class="slot-actions" *ngIf="agendamento">
                    <button
                      class="finalizar-btn"
                      mat-stroked-button
                      color="accent"
                      [disabled]="isFinalizando(agendamento)"
                      type="button"
                      (click)="onFinalizarAgendamentoClick(agendamento, $event)"
                    >
                      {{ isFinalizando(agendamento) ? 'Finalizando...' : 'Finalizar' }}
                    </button>
                  </div>
                </ng-container>

                <!-- Slot disponível -->
                <ng-template #disponivel>
                  <button
                    class="slot-disponivel"
                    mat-stroked-button
                    (click)="
                      onAgendamentoClick(hora, grupo.profissional.id)
                    "
                  >
                    Disponível
                  </button>
                </ng-template>
              </ng-container>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>
